name: Tally
options:
  bundleIdPrefix: com.tally
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asimplelife.tally
        INFOPLIST_FILE: Tally/Info.plist
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: Tally/Info.plist
      properties:
        NSCameraUsageDescription: Tally uses the camera to capture receipts.
        NSPhotoLibraryUsageDescription: Tally accesses your photos to import receipt images.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Light
        GADApplicationIdentifier: ca-app-pub-7313737046490523~6760288655
    entitlements:
      path: Tally/Tally.entitlements
      properties: {}
      # --- Enable when enrolled in Apple Developer Program ($99/year) ---
      # properties:
      #   aps-environment: development
      #   com.apple.developer.applesignin:
      #     - Default
      #   com.apple.developer.icloud-container-identifiers:
      #     - iCloud.com.asimplelife.tally
      #   com.apple.developer.icloud-services:
      #     - CloudKit
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallyTests
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asimplelife.tally.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Tally

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

schemes:
  Tally:
    build:
      targets:
        Tally: all
        TallyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TallyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
